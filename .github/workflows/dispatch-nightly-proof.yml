# Temporary seat helper: honr-app cannot Actions-dispatch from outside the runner.
# Push to honr/card-55 triggers a same-repo workflow_dispatch of nightly-rebuild
# with the minimal green-subset inputs (no multi-hour bib/site).
name: Dispatch nightly proof

on:
  push:
    branches: [honr/card-55]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-nightly-proof
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: workflow_dispatch nightly-rebuild (minimal bake)
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'honr/card-55';
            core.info(`Dispatching nightly-rebuild.yml on ${ref}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'nightly-rebuild.yml',
              ref,
              inputs: {
                rebase: 'false',
                push_images: 'true',
                build_container_disk: 'false',
                build_hermes: 'false',
                build_hermes_minimal: 'false',
                build_site_hermes: 'false',
              },
            });
            core.info('Dispatch accepted');
