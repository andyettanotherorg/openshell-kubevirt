# Temporary seat helper: honr-app cannot Actions-dispatch from outside the runner.
# Push to honr/card-55 triggers a same-repo workflow_dispatch of nightly-rebuild
# with the FULL bake inputs (all image/job paths). Remove the push trigger after
# the dispatch is accepted so doc commits do not re-bake.
name: Dispatch nightly proof

on:
  push:
    branches: [honr/card-55]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-nightly-proof
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: workflow_dispatch nightly-rebuild (full bake)
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'honr/card-55';
            const inputs = {
              rebase: 'false',
              push_images: 'true',
              build_container_disk: 'true',
              build_hermes: 'true',
              build_hermes_minimal: 'true',
              build_site_hermes: 'true',
            };
            core.info(`Dispatching nightly-rebuild.yml on ${ref} inputs=${JSON.stringify(inputs)}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'nightly-rebuild.yml',
              ref,
              inputs,
            });
            core.info('Dispatch accepted');
